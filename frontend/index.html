<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Librarian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var KEY = "librarian.ui_theme";
          var FONT_KEY = "librarian.ui_font_step";
          var STEPS = ["15px", "16px", "17px", "18.5px", "20px", "22px"];
          var stored = localStorage.getItem(KEY) || "system";
          if (stored !== "lights_up" && stored !== "lights_down" && stored !== "system") {
            stored = "system";
          }
          var effective = stored;
          if (stored === "system") {
            effective =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "lights_up"
                : "lights_down";
          }
          var attr = effective === "lights_up" ? "lights-up" : "lights-down";
          document.documentElement.setAttribute("data-theme", attr);
          document.documentElement.style.colorScheme =
            effective === "lights_up" ? "light" : "dark";
          var step = parseInt(localStorage.getItem(FONT_KEY) || "0", 10);
          if (!isFinite(step) || step < 0) step = 0;
          if (step > 5) step = 5;
          document.documentElement.style.setProperty("--base-font-size", STEPS[step]);
          document.documentElement.dataset.fontStep = String(step);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "lights-down");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
