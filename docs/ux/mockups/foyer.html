<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Librarian — Login foyer</title>
    <link rel="stylesheet" href="reading-room.css" />
  </head>
  <body>
    <nav class="mock-nav" aria-label="Mockup screens">
      <a class="is-here" href="foyer.html">Foyer</a>
      <a href="hall.html">Hall</a>
      <a href="search.html">Search</a>
      <a href="peek.html">Peek</a>
      <a href="work.html">Work</a>
    </nav>

    <main class="foyer">
      <div class="lamp-shaft" aria-hidden="true"></div>
      <div class="lamp-bulb" aria-hidden="true"></div>
      <div class="dust" aria-hidden="true"></div>
      <div class="page-turn" aria-hidden="true"></div>
      <div class="spines" aria-hidden="true">
        <div class="spine" style="height:72%;background-color:#4a2c22"></div>
        <div class="spine" style="height:88%;background-color:#2a3344"></div>
        <div class="spine" style="height:64%;background-color:#3d4a32"></div>
        <div class="spine" style="height:94%;background-color:#5a3a1c"></div>
        <div class="spine" style="height:70%;background-color:#2c2420"></div>
        <div class="spine" style="height:82%;background-color:#6b3e2a"></div>
        <div class="spine" style="height:58%;background-color:#1e2a3a"></div>
        <div class="spine" style="height:90%;background-color:#4a3548"></div>
        <div class="spine" style="height:76%;background-color:#3a2a18"></div>
        <div class="spine" style="height:85%;background-color:#243044"></div>
        <div class="spine" style="height:62%;background-color:#4e3a28"></div>
        <div class="spine" style="height:96%;background-color:#2f241c"></div>
        <div class="spine" style="height:68%;background-color:#35402e"></div>
        <div class="spine" style="height:80%;background-color:#5c2e24"></div>
        <div class="spine" style="height:74%;background-color:#1c2430"></div>
        <div class="spine" style="height:91%;background-color:#463218"></div>
      </div>

      <form class="glass" action="hall.html">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" width="32" height="32">
          <path fill="currentColor" d="M16 3c-1.2 0-2 .8-2 2v1.2c-4.4.8-7.5 3.4-8.2 7.1-.2 1 .6 1.7 1.6 1.7h1.1c.6 4.6 3.8 7.6 7.5 8.6V26h-3c-.6 0-1 .4-1 1s.4 1 1 1h8c.6 0 1-.4 1-1s-.4-1-1-1h-3v-2.4c3.7-1 6.9-4 7.5-8.6h1.1c1 0 1.8-.7 1.6-1.7C25.5 9.6 22.4 7 18 6.2V5c0-1.2-.8-2-2-2zm0 5.2c3.5.6 5.9 2.6 6.4 5.5H9.6C10.1 10.8 12.5 8.8 16 8.2z" />
        </svg>
        <p class="kicker">Household library</p>
        <h1>The Reading Room</h1>
        <p class="lede">A quiet door. No covers of household titles on the glass — only lamp light and paper dust.</p>

        <div class="field">
          <label for="user">Name</label>
          <input id="user" name="username" autocomplete="username" value="will" />
        </div>
        <div class="field">
          <label for="pass">Password</label>
          <input id="pass" name="password" type="password" autocomplete="current-password" value="••••••••" />
        </div>
        <button class="cta" type="submit">Enter</button>
        <p class="lede">Join is the same foyer. An invite shows a quiet seal — Reader or Op — never a second visual language.</p>
      </form>
    </main>
  </body>
</html>
