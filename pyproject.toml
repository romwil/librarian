[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "librarian"
version = "0.4.18"
description = "Household reading-room library for books, magazines, comics, audiobooks, and music on Automat."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "romwil" }]
keywords = ["ebooks", "comics", "usenet", "sabnzbd", "unraid", "library"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "mutagen>=1.47.0",
]
dev = [
    "coverage>=7.0",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/romwil/librarian"
Repository = "https://github.com/romwil/librarian"
Issues = "https://github.com/romwil/librarian/issues"

[project.scripts]
librarian-web = "librarian.web.__main__:main"

[tool.pytest.ini_options]
addopts = "--cov=librarian --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["librarian*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    ".venv-test",
    "build",
    "dist",
    "node_modules",
    "frontend",
    "librarian.egg-info",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "F841", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["librarian"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_return_any = false
files = [
    "librarian/config.py",
    "librarian/sessions.py",
    "librarian/invites.py",
    "librarian/kinds.py",
    "librarian/gaps.py",
    "librarian/proxy.py",
    "librarian/rate_limit.py",
]
