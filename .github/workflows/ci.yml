# Required merge gate (sprint 0.2 convert-slip-ci).
# Product 8793 is not used here. Playwright binds mocked e2e on 8794 only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBRARIAN_PBKDF2_ITERATIONS: "1000"
  LIBRARIAN_SKIP_APP_BOOT: "1"
  LIBRARIAN_SESSION_SECRET: "ci-session-secret-value-not-dev-default"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hashed lockfile
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check librarian tests
      - name: Pytest
        run: python -m pytest tests/

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Install Node
        run: |
          npm ci
          npm ci --prefix frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright on 8794
        env:
          CI: "true"
          E2E_PORT: "8794"
        run: npm run test:e2e
